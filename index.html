<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Gift Reactor</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
background:#080810;
color:white;
font-family:Arial,sans-serif;
overflow:hidden;
}

.app{
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

#stage{
width:100%;
height:100vh;
position:relative;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
background:radial-gradient(circle,#32115a,#090912 70%);
}

#emoji{
font-size:140px;
}

#message{
font-size:42px;
font-weight:bold;
margin-top:15px;
}

.controls{
position:fixed;
bottom:15px;
left:15px;
display:flex;
flex-wrap:wrap;
gap:8px;
max-width:420px;
z-index:999;
}

button{
border:0;
padding:12px 18px;
border-radius:12px;
font-weight:bold;
cursor:pointer;
color:white;
}

.start{background:#00a86b}
.stop{background:#d52d50}
.gift{background:#6531d9}
.special{background:#f15a00}

.particle{
position:absolute;
font-size:40px;
pointer-events:none;
animation:explode 1.2s forwards;
}

@keyframes explode{
from{
left:50%;
top:50%;
transform:translate(-50%,-50%) scale(.4);
opacity:1;
}
to{
left:calc(50% + var(--x));
top:calc(50% + var(--y));
transform:translate(-50%,-50%) scale(1.8) rotate(360deg);
opacity:0;
}
}

.flash{
position:absolute;
inset:0;
background:white;
opacity:0;
pointer-events:none;
}

.flash.active{
animation:flash .3s;
}

@keyframes flash{
0%{opacity:.8}
100%{opacity:0}
}

.shake{
animation:shake .35s;
}

@keyframes shake{
0%,100%{transform:translateX(0)}
25%{transform:translateX(-8px)}
75%{transform:translateX(8px)}
}
</style>
</head>

<body>

<div class="app">

<div id="stage">

<div class="flash" id="flash"></div>

<div>
<div id="emoji">🎁</div>
<div id="message">LIVE READY</div>
</div>

</div>

<div class="controls" id="controls">

<button class="start" onclick="startBot()">START</button>

<button class="stop" onclick="stopBot()">STOP</button>

<button class="gift" onclick="gift('🌹','РОЗА!','pink')">🌹</button>

<button class="gift" onclick="gift('❤️','СЪРЦЕ!','red')">❤️</button>

<button class="gift" onclick="gift('🔥','ОГЪН!','orange')">🔥</button>

<button class="gift" onclick="gift('🌌','GALAXY!','purple')">🌌</button>

<button class="gift" onclick="gift('🦁','ЛЪВ!','gold')">🦁</button>

<button class="gift" onclick="gift('💎','ДИАМАНТ!','cyan')">💎</button>

<button class="special" onclick="megaCombo()">MEGA</button>

</div>

</div>

<audio id="bgmusic" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>

const ADMIN_KEY="saily2026";

const isAdmin=
new URLSearchParams(location.search)
.get("admin")===ADMIN_KEY;

if(!isAdmin){
document.getElementById("controls").style.display="none";
}

let running=false;

const emojiEl=document.getElementById("emoji");
const messageEl=document.getElementById("message");
const stage=document.getElementById("stage");
const flash=document.getElementById("flash");

function startBot(){

running=true;

document.getElementById("bgmusic")
.play()
.catch(()=>{});

react(
"🚀",
"LIVE АКТИВЕН",
"#00ff88"
);

}

function stopBot(){

running=false;

document.getElementById("bgmusic")
.pause();

react(
"⛔",
"СПРЯН",
"#ff4444"
);

}

function gift(
emoji,
text,
color
){

if(!running)return;

react(
emoji,
text,
getColor(color)
);

explode(emoji);

}

function megaCombo(){

if(!running)return;

let count=0;

const timer=setInterval(()=>{

const list=[
["🌹","РОЗА","pink"],
["❤️","СЪРЦЕ","red"],
["🔥","ОГЪН","orange"],
["🌌","GALAXY","purple"],
["🦁","ЛЪВ","gold"],
["💎","ДИАМАНТ","cyan"]
];

const r=
list[Math.floor(Math.random()*list.length)];

gift(...r);

count++;

if(count>=15){
clearInterval(timer);
}

},150);

}

function react(
emoji,
text,
color
){

emojiEl.textContent=emoji;
messageEl.textContent=text;
messageEl.style.color=color;

stage.classList.remove("shake");
void stage.offsetWidth;
stage.classList.add("shake");

flash.classList.remove("active");
void flash.offsetWidth;
flash.classList.add("active");

}

function explode(
emoji
){

for(let i=0;i<25;i++){

const p=
document.createElement("div");

p.className="particle";
p.textContent=emoji;

p.style.setProperty(
"--x",
(Math.random()*700-350)+"px"
);

p.style.setProperty(
"--y",
(Math.random()*500-250)+"px"
);

stage.appendChild(p);

setTimeout(()=>{
p.remove();
},1200);

}

}

function getColor(name){

return{
pink:"#ff3b81",
red:"#ff1744",
orange:"#ff6500",
purple:"#b14cff",
gold:"#ffc400",
cyan:"#00eaff"
}[name]||"#fff";

}

</script>

</body>
</html>
